name: Build APK and Deploy Web

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      # Android APK बनाएगा
      - name: Build Debug APK
        run: flutter build apk --debug

      # APK को Artifacts में डाउनलोड के लिए अपलोड करेगा
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rakshika-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Web वर्ज़न बनाएगा
      - name: Build Web
        run: flutter build web --release --base-href "/rakshika-app/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
